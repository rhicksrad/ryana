<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Budget · Ryana</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#2f6f5e" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ryana">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="assets/app.css?v=20261017140918">
</head>
<body class="loading">
  <header class="topbar">
    <a class="brand" href="budget.html"><img class="brand-mark" src="assets/icon-192.png" alt="" width="28" height="28">Ryana</a>
    <nav class="tabs" aria-label="Sections">
      <a href="budget.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 8V6.5A1.5 1.5 0 0 0 17.5 5h-11A2.5 2.5 0 0 0 4 7.5v9A2.5 2.5 0 0 0 6.5 19h12a1.5 1.5 0 0 0 1.5-1.5V9.5A1.5 1.5 0 0 0 18.5 8H6.5A2.5 2.5 0 0 1 4 5.5"/><circle cx="16" cy="13.5" r="1.2" fill="currentColor" stroke="none"/></svg><span>Budget</span></a>
      <a href="calendar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.2" fill="currentColor" stroke="none"/></svg><span>Calendar</span></a>
      <a href="shopping.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10h17l-1.7 8.3a2 2 0 0 1-2 1.7H7.2a2 2 0 0 1-2-1.7L3.5 10z"/><path d="M8.5 10 11 4.5M15.5 10 13 4.5M9.5 14v2.5M14.5 14v2.5"/></svg><span>Shopping</span></a>
      <a href="todos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4.5"/><path d="m8.5 12.2 2.4 2.3 4.6-4.9"/></svg><span>To-dos</span></a>
    </nav>
    <div class="me">
      <span class="avatar" id="me-initial" aria-hidden="true"></span>
      <span class="me-name" id="me-name"></span>
      <button class="link" id="logout" type="button">Sign out</button>
    </div>
  </header>

  <main class="wrap">
    <section class="hero empty" id="hero" aria-label="Photos"></section>

    <div class="page-head">
      <h1><img class="spot" src="assets/art/spot-budget.webp" alt="" width="56" height="56">Budget</h1>
      <div class="month-switch">
        <button class="icon-btn" id="prev" type="button" aria-label="Previous month">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg>
        </button>
        <h2 id="month-label" aria-live="polite"></h2>
        <button class="icon-btn" id="next" type="button" aria-label="Next month">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></svg>
        </button>
        <button class="btn secondary small" id="this-month" type="button">This month</button>
      </div>
    </div>

    <section class="summary" id="summary" aria-label="Month summary"></section>

    <div class="grid-2 insights">
      <section class="card" aria-labelledby="who-h">
        <div class="card-head">
          <h3 id="who-h">Who paid</h3>
          <span class="muted">Paid bills + spending</span>
        </div>
        <div class="card-body" id="who-paid"></div>
      </section>

      <section class="card" aria-labelledby="cat-h">
        <div class="card-head">
          <h3 id="cat-h">Where it went</h3>
          <span class="muted">Bills + spending by category</span>
        </div>
        <div class="card-body" id="categories"></div>
      </section>
    </div>

    <section class="card" aria-labelledby="bills-h">
      <div class="card-head">
        <h3 id="bills-h">Bills</h3>
        <span class="muted count" id="bills-meta"></span>
        <button class="btn small" type="button" id="add-bill">+ Add bill</button>
      </div>
      <div class="progress" aria-hidden="true"><span id="bills-progress"></span></div>
      <button class="fold-toggle hidden" type="button" id="bills-fold" aria-controls="bills" aria-expanded="false"></button>
      <ul class="rows" id="bills"></ul>
    </section>

    <section class="card" aria-labelledby="spend-h">
      <div class="card-head">
        <h3 id="spend-h">Spending</h3>
        <span class="muted">Groceries, eating out, anything that isn't a bill</span>
        <button class="btn small" type="button" id="add-expense">+ Add spending</button>
      </div>
      <div class="chips quick-spend" id="quick-spend" role="group" aria-label="Quick add"></div>
      <button class="fold-toggle hidden" type="button" id="expenses-fold" aria-controls="expenses" aria-expanded="false"></button>
      <ul class="rows" id="expenses"></ul>
    </section>

    <div class="grid-2">
      <section class="card" aria-labelledby="income-h">
        <div class="card-head">
          <h3 id="income-h">Income</h3>
          <button class="btn small" type="button" id="add-income">+ Add income</button>
        </div>
        <ul class="rows" id="income"></ul>
      </section>

      <section class="card" aria-labelledby="transfers-h" id="transfers-card">
        <div class="card-head">
          <h3 id="transfers-h">Transfers</h3>
          <span class="muted">Between the two of you</span>
          <button class="btn small" type="button" id="add-transfer">+ Add transfer</button>
        </div>
        <ul class="rows" id="transfers"></ul>
      </section>
    </div>
  </main>

  <dialog id="dialog"><form id="dialog-form" novalidate></form></dialog>
  <div class="toast hidden" id="toast" role="status"></div>

  <script src="assets/vendor/supabase.js"></script>
  <script type="module" src="assets/budget.js?v=20261017140918"></script>
</body>
</html>
