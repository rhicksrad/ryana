<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'none'; form-action 'self'">
  <title>Sign in · Ryana</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#2f6f5e" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ryana">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="assets/app.css?v=20261017133225">
</head>
<body>
  <main class="auth">
    <div class="auth-card">
      <img class="auth-art" src="assets/art/login-hero.webp" alt="" width="1536" height="1024">
      <div class="brand"><img class="brand-mark" src="assets/icon-192.png" alt="" width="28" height="28">Ryana</div>
      <p class="lede">Ryan &amp; Ana's home base</p>
      <form id="login-form">
        <label class="field"><span>Email</span><input name="email" type="email" autocomplete="username" required autofocus></label>
        <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
        <p class="form-error" id="error" role="alert"></p>
        <button class="btn" type="submit">Sign in</button>
        <button class="link center" type="button" id="forgot">Forgot password?</button>
      </form>
    </div>
  </main>
  <script src="assets/vendor/supabase.js"></script>
  <script type="module" src="assets/login.js?v=20261017133225"></script>
</body>
</html>
