<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'none'; form-action 'self'">
  <title>Shopping · Ryana</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#2f6f5e" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ryana">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="assets/app.css?v=20261017133225">
</head>
<body class="loading">
  <header class="topbar">
    <a class="brand" href="budget.html"><img class="brand-mark" src="assets/icon-192.png" alt="" width="28" height="28">Ryana</a>
    <nav class="tabs" aria-label="Sections">
      <a href="budget.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 8V6.5A1.5 1.5 0 0 0 17.5 5h-11A2.5 2.5 0 0 0 4 7.5v9A2.5 2.5 0 0 0 6.5 19h12a1.5 1.5 0 0 0 1.5-1.5V9.5A1.5 1.5 0 0 0 18.5 8H6.5A2.5 2.5 0 0 1 4 5.5"/><circle cx="16" cy="13.5" r="1.2" fill="currentColor" stroke="none"/></svg><span>Budget</span></a>
      <a href="shopping.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10h17l-1.7 8.3a2 2 0 0 1-2 1.7H7.2a2 2 0 0 1-2-1.7L3.5 10z"/><path d="M8.5 10 11 4.5M15.5 10 13 4.5M9.5 14v2.5M14.5 14v2.5"/></svg><span>Shopping</span></a>
      <a href="todos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4.5"/><path d="m8.5 12.2 2.4 2.3 4.6-4.9"/></svg><span>To-dos</span></a>
    </nav>
    <div class="me">
      <span class="avatar" id="me-initial" aria-hidden="true"></span>
      <span class="me-name" id="me-name"></span>
      <button class="link" id="logout" type="button">Sign out</button>
    </div>
  </header>

  <main class="wrap narrow">
    <section class="hero compact empty" id="hero" aria-label="Photos"></section>

    <div class="page-head">
      <h1><img class="spot" src="assets/art/spot-shopping.webp" alt="" width="56" height="56">Shopping</h1>
      <div class="head-actions">
        <button class="icon-btn" type="button" id="rename-list" aria-label="Rename this list" title="Rename list"></button>
        <button class="icon-btn" type="button" id="delete-list" aria-label="Delete this list" title="Delete list"></button>
      </div>
    </div>

    <div class="chips" id="lists" role="group" aria-label="Lists"></div>

    <form class="quick-add card" id="add-item" autocomplete="off">
      <input name="name" placeholder="Add an item… (try “2 avocados”)" aria-label="Item" maxlength="80" required>
      <input name="quantity" class="qty" placeholder="Qty" aria-label="Quantity" maxlength="20">
      <button class="btn" type="submit">Add</button>
    </form>

    <section class="card" aria-labelledby="need-h">
      <div class="card-head">
        <h3 id="need-h">To get</h3>
        <span class="muted count" id="need-count"></span>
      </div>
      <ul class="rows" id="need"></ul>
    </section>

    <section class="card" aria-labelledby="got-h" id="got-card">
      <div class="card-head">
        <h3 id="got-h">In the cart</h3>
        <span class="muted count" id="got-count"></span>
        <button class="btn secondary small" type="button" id="clear-got">Clear checked</button>
      </div>
      <ul class="rows" id="got"></ul>
    </section>
  </main>

  <dialog id="dialog"><form id="dialog-form" novalidate></form></dialog>
  <div class="toast hidden" id="toast" role="status"></div>

  <script src="assets/vendor/supabase.js"></script>
  <script type="module" src="assets/shopping.js?v=20261017133225"></script>
</body>
</html>
